<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="coracao.png">
    <link rel="stylesheet" href="style.css">
    <title>Inscrição para MPS 2026</title>
</head>
<body>
    <header>
        <h1>Inscrição para Maratona de Programação SENAI 2026</h1>
        <nav> 
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#">Regulamento</a></li>
                <li><a href="#">Dúvidas</a></li>
                <li><a href="#">Outro Link</a></li>
            </ul>
        </nav>
    </header>
<br>

<main> 
    <h2>Formulário de Inscrição</h2>
    <p>Preencha o formulário abaixo para se inscrever na Maratona de Programação SENAI 2026.</p>
    <form action="#" method="post">
        <div>
            <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
        <br><br>
        </div>
    
        <div>
            <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seu.email@senai.com">
        <br><br>
        </div>

        <div>
            <label for="telefone">Telefone para contato:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Ex: (11) 99999-9999">
            <br><br>
        </div>

        <div>
            <label for="conhecimento">Nível de Conhecimento:</label>
            <select id="nivel" name="nivel">
                <option value="iniciante">Básico (HTML e CSS)</option>
                <option value="intermediario">Intermediário (JavaScript)</option>
                <option value="avancado">Avançado (Full Stack)</option>
            </select>
            <br><br>

            <button type="submit" value="Enviar Inscrição">
            Enviar Inscrição
        </button>

        </div>
    </form>



    </form>

<br><br><br>

<footer>
    <p>&copy; 2026 Maratona de Programação SENAI. Todos os direitos reservados.</p>
    <!--vincular o script javascript-->
    <script src="script.js"></script>
</footer>

</main>
</body>

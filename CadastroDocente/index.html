<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="simbolo.png">
    <link rel="stylesheet" href="style.css">
    <title>SENAI - Cadastro Docentes</title>
</head>

<body>
    <header>
    <h1>Cadastro de Docentes | SENAI - Pompeia-SP</h1>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="https://transparencia.sp.senai.br/sac">Fale Conosco</a></li>
            <li><a href="https://www.sp.senai.br/o-senai/o-sistema-senai">Sobre Nós</a></li>
        </ul>
    </nav>
</header>
    <br>

     
    <main>
        <h2>Formulário de Inscrição</h2>
        <p>Preencha o cadastro para docentes | SENAI</p>
        <form action="#" method="post">
            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
                <br><br>
            </div>

            <div>
                <label for="email">Email Institucional:</label>
                <input type="email" id="email" name="email" placeholder="Ex: joao@senai.br">
                <br><br>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha.">
                <br><br>
            </div>

            <div>
                <label for="senha">Confirmação de senha:</label>
                <input type="password" id="confirmarSenha" name="senha" placeholder="Digite sua senha.">
                <br><br>
            </div>

            <div>
                <label for="cod">Código do funcionário:</label>
                <input type="text" id="cod" name="cod" placeholder="Ex: 0000000" maxlength="7">
                <br><br>
            </div>

            <div>
                <label for="telefoe">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="Ex: (11) 99999-9999">
                <br><br>
            </div>

            <div>
                <label for="area">Área de atuação:</label>
                <select id="area" name="area">
                    <option value="Português">Português</option>
                    <option value="Matemática">Matemática</option>
                    <option value="História">História</option>
                    <option value="Geografia">Geografia</option>
                    <option value="Biologia">Biologia</option>
                    <option value="Física">Física</option>
                    <option value="Química">Química</option>
                    <option value="Inglês">Inglês</option>
                    <option value="Arte">Arte</option>
                    <option value="Filosofia">Filosofia</option>
                    <option value="Sociologia">Sociologia</option>
                    <option value="Educação Física">Educação Física</option>
                    <option value="TI">TI</option>
                    <option value="Mecânica">Mecânica</option>
                    <option value="Eletroeletrônica">Eletroeletrônica</option>
                </select>
                <br><br>

                <button type="submit" value="Enviar Inscrição">
                    Enviar
                </button>

            </div>
        </form>



        </form>

        <br><br><br>

        <footer>
            <p>&copy; SENAI 2026. Todos os direitos reservados.</p>
            <!--vincular o script javascript-->
            <script src="script.js"></script>
        </footer>

    </main>
</body>
